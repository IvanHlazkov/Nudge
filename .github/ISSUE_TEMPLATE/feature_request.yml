name: Feature request
description: Suggest an idea for Nudge
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Nudge to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to do that's hard right now?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Optional. Sketches, screenshots or examples from other apps.
