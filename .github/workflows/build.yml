name: Build Nudge

# Builds the Mac app on every push to main (to catch errors),
# and publishes a downloadable Nudge.zip when you push a tag like v1.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project Nudge.xcodeproj -target Nudge -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Release/Nudge.app || { tail -80 build.log; exit 1; }

      - name: Zip the app
        run: ditto -c -k --keepParent build/Release/Nudge.app Nudge-mac.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-mac
          path: Nudge-mac.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Nudge-mac.zip \
            --title "Nudge $GITHUB_REF_NAME" --generate-notes
