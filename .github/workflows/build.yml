name: Build Nudge

# Builds the Mac app on every push to main (to catch errors).
# Publishing a GitHub Release (or pushing a tag like v1.1) attaches Nudge-mac.zip to it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project Nudge.xcodeproj -target Nudge -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Release/Nudge.app || { tail -80 build.log; exit 1; }

      - name: Zip the app
        run: ditto -c -k --keepParent build/Release/Nudge.app Nudge-mac.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-mac
          path: Nudge-mac.zip

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Nudge $TAG" --generate-notes
          gh release upload "$TAG" Nudge-mac.zip --clobber
