name: Bug report
description: Something in Nudge isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌥Space
        2. Type "gym at 18:30"
        3. ...
    validations:
      required: true
  - type: input
    id: nudge-version
    attributes:
      label: Nudge version
      description: Shown at the bottom left of Settings.
      placeholder: "1.1"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu › About This Mac
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
